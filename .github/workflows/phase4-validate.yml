name: Phase 4 production validation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

jobs:
  validate-production:
    runs-on: ubuntu-latest
    steps:
      - name: Run production read-only validator
        env:
          SITE_URL: https://darkviolet-ibis-337737.hostingersite.com
          CRON_SECRET: ${{ secrets.CAUSALEDGE_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          response="$(curl --fail-with-body --silent --show-error             --request GET "$SITE_URL/api/phase4/validate"             --header "x-engine-secret: $CRON_SECRET")"
          printf '%s
' "$response"
          echo "$response" | grep -q '"ok":true'
          echo "$response" | grep -q '"orderPlaced":false'
          echo "$response" | grep -q '"liveTradingEnabled":false'

name: CausalEdge multi-bot paper engine

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-paper-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Run guarded multi-bot paper cycle
        env:
          SITE_URL: https://darkviolet-ibis-337737.hostingersite.com
          CRON_SECRET: ${{ secrets.CAUSALEDGE_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --request POST "$SITE_URL/api/bots/run" \
            --header "x-engine-secret: $CRON_SECRET"

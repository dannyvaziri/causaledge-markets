name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Prepare Hostinger environment template
        if: github.event_name == 'push'
        run: |
          cat > .env.production <<'EOF'
          APP_URL=https://yellowgreen-coyote-640624.hostingersite.com
          DASHBOARD_TOKEN=
          ENGINE_SECRET=
          CHALLENGE_START=100
          CHALLENGE_TARGET=1000
          CHALLENGE_WATCHLIST=AAPL,MSFT,NVDA,AMZN,META,GOOGL,TSLA,AMD,JPM,SPY
          PAPER_EXECUTION_ENABLED=false
          AUTO_EXECUTION_ENABLED=false
          TRADING_KILL_SWITCH=false
          ALPACA_API_KEY=
          ALPACA_API_SECRET=
          OPENAI_API_KEY=
          OPENAI_MODEL=gpt-5.4-mini
          AUTH_SECRET=
          GOOGLE_CLIENT_ID=
          GOOGLE_CLIENT_SECRET=
          ALPACA_OAUTH_CLIENT_ID=
          ALPACA_OAUTH_CLIENT_SECRET=
          EOF
      - name: Package Hostinger upload
        if: github.event_name == 'push'
        run: |
          zip -r causaledge-markets.zip . \
            -x '.git/*' '.github/*' 'node_modules/*' '.next/*' \
               '.env' '.env.local' '.env.*.local' 'npm-debug.log*' '.DS_Store'
      - name: Upload Hostinger package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: causaledge-markets-hostinger
          path: causaledge-markets.zip
          if-no-files-found: error
          retention-days: 7
